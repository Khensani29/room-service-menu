backend:
  name: github
  repo: Khensani29/room-service-menu
  branch: main
  base_url: https://milners-cms-auth.marketing-a5a.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: room-service-menu-upload/public/assets/uploads
public_folder: /assets/uploads

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: design
        label: Design and Images
        file: room-service-menu-upload/public/content/settings.json
        format: json
        fields:
          - label: Website Font
            name: font
            widget: select
            default: montserrat
            options:
              - { label: Montserrat, value: montserrat }
              - { label: Georgia, value: georgia }
              - { label: Arial, value: arial }

          - { label: Header Image, name: headerImage, widget: image, required: false }
          - { label: Footer Image, name: footerImage, widget: image, required: false }
          - { label: Hotel Logo, name: logo, widget: image, required: false }
          - { label: Hotel Name, name: hotelName, widget: string }
          - { label: Header Welcome Text, name: welcomeText, widget: text }
          - { label: Footer Text, name: footerText, widget: text }
          - { label: Dark Header Colour, name: darkColour, widget: string }
          - { label: Main Colour, name: mainColour, widget: string }
          - { label: Highlight Colour, name: highlightColour, widget: string }
          - { label: Gold Accent Colour, name: goldColour, widget: string }
          - { label: Background Colour, name: backgroundColour, widget: string }
          - { label: Text Colour, name: textColour, widget: string }

  - name: room_service
    label: Room Service
    files:
      - name: menu
        label: Menu and Service Details
        file: room-service-menu-upload/public/content/menu.json
        format: json
        fields:
          - { label: Menu Title, name: title, widget: string }

          - label: Service Details
            name: service
            widget: object
            fields:
              - { label: Availability, name: availability, widget: string }
              - { label: Ordering Instruction, name: dial, widget: string }
              - { label: Waiting Time, name: waitTime, widget: string }

          - label: Menu Sections
            name: categories
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Section Name, name: name, widget: string }
              - { label: Section Note, name: note, widget: text, required: false }
              - { label: Section Banner Image, name: bannerImage, widget: image, required: false }

              - label: Menu Items
                name: items
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: Item Name, name: name, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - { label: Price, name: price, widget: string }

                  - label: Dietary Labels
                    name: dietary
                    widget: select
                    multiple: true
                    required: false
                    options:
                      - { label: Vegetarian, value: vegetarian }
                      - { label: Vegan, value: vegan }
                      - { label: Spicy, value: spicy }
